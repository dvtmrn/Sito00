media:
  input: docs/public/images
  output: /images

content:
  - name: home
    label: Home Page
    type: file
    path: docs/src/content/docs/index.mdx
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: Descrizione
        type: string
      - name: body
        label: Contenuto
        type: rich-text

  - name: docs_mdx
    label: Pagine Principali (MDX)
    type: collection
    path: docs/src/content/docs
    extension: mdx
    exclude:
      - index.mdx
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: Descrizione
        type: string
      - name: body
        label: Contenuto
        type: rich-text

  - name: docs_md
    label: Altre Pagine (MD)
    type: collection
    path: docs/src/content/docs
    extension: md
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: Descrizione
        type: string
      - name: body
        label: Contenuto
        type: rich-text

  - name: app
    label: App
    type: collection
    path: docs/src/content/docs/app
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: description
        label: Descrizione
        type: string
      - name: body
        label: Contenuto
        type: rich-text
